<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>SafeAI</h1>
    <p>Detector de spam usando inteligência artificial</p>
  </header>

  <main>
    <h2>Analise seu e-mail</h2>

    <form id="formulario">
      <label for="email">Texto do e-mail:</label>
      <textarea id="email" placeholder="coloque aqui o texto enviado no seu e-mail..." required></textarea>

      <label for="imagens">Imagens do e-mail:</label>
      <input type="file" id="imagens" accept="image/*" multiple>

      <button type="submit">Analisar e-mail</button>
    </form>

    <p id="mensagem"></p>

    <section id="resultado" hidden>
      <h2>Resultado</h2>
      <p id="classificacao"></p>
      <p id="risco"></p>
      <p id="explicacao"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
